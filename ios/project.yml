name: Kanjo
options:
  bundleIdPrefix: com.lanshuagent.kanjo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  KanjoCore:
    path: ../ui
targets:
  Kanjo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Kanjo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanshuagent.kanjo.ios
        PRODUCT_NAME: Kanjo
        DEVELOPMENT_TEAM: Z5D5N7CU6L
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Kanjo/Kanjo.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kanjo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: KanjoCore
        product: KanjoCore

schemes:
  Kanjo:
    build:
      targets:
        Kanjo: all
    run:
      config: Debug
    archive:
      config: Release
