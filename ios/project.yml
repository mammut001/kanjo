name: Kanjo
options:
  bundleIdPrefix: com.lanshuagent.kanjo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # 小组件配置意图的文案在扩展 bundle 里，工程要声明这三种语言才会打进包。
  knownRegions:
    - en
    - Base
    - zh-Hans
    - fr
packages:
  KanjoCore:
    path: ../ui
targets:
  Kanjo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Kanjo
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanshuagent.kanjo.ios
        PRODUCT_NAME: Kanjo
        DEVELOPMENT_TEAM: Z5D5N7CU6L
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Kanjo/Kanjo.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kanjo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # Only system HTTPS/CloudKit: exempt, so App Store Connect stops asking on every upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.6.13"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Kanjo/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.lanshuagent.kanjo.ios
            CFBundleURLSchemes:
              - kanjo
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.lanshuagent.kanjo.ios.refresh
    dependencies:
      - package: KanjoCore
        product: KanjoCore
      - target: KanjoWidget
        embed: true

  KanjoWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KanjoWidget
      - path: Shared
      - path: Kanjo/Theme/IOSPalette.swift
      - path: Kanjo/Resources/sample-snapshot.json
        buildPhase: resources
    info:
      path: KanjoWidget/Info.plist
      properties:
        # 扩展自己的本地化列表。不写的话系统只认宿主 App 的开发语言（en）。
        CFBundleLocalizations:
          - en
          - zh-Hans
          - fr
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanshuagent.kanjo.ios.widget
        PRODUCT_NAME: KanjoWidget
        DEVELOPMENT_TEAM: Z5D5N7CU6L
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: KanjoWidget/KanjoWidget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kanjo
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.6.13"
        CURRENT_PROJECT_VERSION: "2"
        SKIP_INSTALL: YES
    dependencies:
      - package: KanjoCore
        product: KanjoCore

  KanjoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KanjoTests
    dependencies:
      - target: Kanjo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lanshuagent.kanjo.ios.tests
        SWIFT_VERSION: "5.0"

schemes:
  Kanjo:
    build:
      targets:
        Kanjo: all
        KanjoWidget: all
    test:
      commandLineArguments:
        "-useSampleSnapshot": true
      targets:
        - KanjoTests
    run:
      config: Debug
    archive:
      config: Release
