name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    name: CLI (Python ${{ matrix.python }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python3 -m unittest -v

  ui:
    name: UI (swift build + test)
    runs-on: macos-26
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      # Liquid Glass (glassEffect) needs the macOS 26 SDK. The macos-26 image ships Xcode 26;
      # if several are installed, take the newest.
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Print lproj layout
        run: find .build -name '*.lproj' -path '*Kanjo_KanjoCore*' | head
      - name: Test
        run: swift test
