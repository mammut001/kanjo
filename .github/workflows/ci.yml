name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    name: CLI (Python ${{ matrix.python }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python3 -m unittest -v

  ui:
    name: UI (swift build + test)
    runs-on: macos-26
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      # Liquid Glass (glassEffect) needs the macOS 26 SDK. The macos-26 image ships Xcode 26;
      # if several are installed, take the newest.
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Print lproj layout
        run: find .build -name '*.lproj' -path '*Kanjo_KanjoCore*' | head
      - name: Test
        run: swift test

  windows:
    name: Windows (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The full CLI suite runs on Windows now (batch 4): agent paths, the Recycle
      # Bin clean, Claude credentials and the tz fallbacks all have Windows branches.
      - name: CLI unit tests
        working-directory: cli
        run: python -m unittest discover -s tests -v
      - name: Build kanjo-cli.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging/kanjo -Force | Out-Null
          Copy-Item -Recurse -Path cli/kanjo/* -Destination staging/kanjo
          Get-ChildItem -Path staging/kanjo -Recurse -Include "__pycache__","*.pyc" | Remove-Item -Recurse -Force
          Copy-Item -Path cli/pricing.json,cli/pricing_overrides.json -Destination staging/
          Compress-Archive -Path staging/* -DestinationPath kanjo-cli.zip -Force
          Remove-Item -Recurse -Force staging
      - name: Assert installer without -Server exits non-zero
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -NoProfile -File scripts/install-family-windows.ps1 -CliZip kanjo-cli.zip -PythonExe python -NoSchedule -SkipReport -NoPrompt
          if ($LASTEXITCODE -eq 0) {
              throw "Expected installer without -Server in -NoPrompt mode to fail, but it exited with 0"
          }
          Write-Host "Installer correctly exited with non-zero code ($LASTEXITCODE) when -Server was omitted."
          exit 0
      - name: Run installer (isolated, no schedule)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -NoProfile -File scripts/install-family-windows.ps1 -Server https://usage.example.com -CliZip kanjo-cli.zip -PythonExe python -NoSchedule -SkipReport -NoPrompt
          if ($LASTEXITCODE -ne 0) { throw "installer exited with $LASTEXITCODE" }
          $Launcher = Join-Path $env:LOCALAPPDATA "KanjoFamily\cli\kanjo_family_report.pyw"
          Push-Location $env:TEMP
          python $Launcher --version
          if ($LASTEXITCODE -ne 0) { throw "launcher failed" }
          Pop-Location
      - name: Token management via Credential Manager
        shell: pwsh
        run: |
          $CliDir = Join-Path $env:LOCALAPPDATA "KanjoFamily\cli"
          $env:PYTHONPATH = $CliDir
          "ci-windows-secret-token" | python -m kanjo family-token set
          $status = python -m kanjo family-token status
          Write-Host "Token status: $status"
          if ($status.Trim() -ne "set") {
              throw "Expected status 'set', got '$status'"
          }
      - name: Validate export --family-report with family-server
        shell: pwsh
        run: |
          $CliDir = Join-Path $env:LOCALAPPDATA "KanjoFamily\cli"
          $env:PYTHONPATH = "$CliDir;family-server"
          python -c @"
          import json, os, subprocess, tempfile, sys
          from family_server.validation import validate_report_payload, check_privacy_backstop

          tmp = tempfile.mkdtemp()
          env = dict(os.environ)
          env['KANJO_NO_NETWORK'] = '1'
          env['KANJO_DATA_DIR'] = os.path.join(tmp, 'data')
          env['KANJO_CACHE_DIR'] = os.path.join(tmp, 'cache')
          env['KANJO_CLAUDE_DIR'] = os.path.abspath('cli/tests/fixtures/claude')
          env['KANJO_ANTIGRAVITY_DIR'] = os.path.abspath('cli/tests/fixtures/antigravity')
          env['KANJO_CODEX_DIR'] = os.path.abspath('cli/tests/fixtures/codex')

          res = subprocess.run([sys.executable, '-m', 'kanjo', 'export', '--family-report', '--no-cache'],
                               capture_output=True, env=env, check=True)
          raw = res.stdout
          doc = json.loads(raw)

          val_err = validate_report_payload(doc)
          if val_err:
              print(f'Validation error: {val_err}', file=sys.stderr)
              sys.exit(1)

          priv_err = check_privacy_backstop(raw)
          if priv_err:
              print(f'Privacy violation: {priv_err}', file=sys.stderr)
              sys.exit(1)

          print('Family report validation and privacy backstop passed!')
          "@
      - name: Report family to local server (read token from Credential Manager)
        shell: pwsh
        run: |
          $CliDir = Join-Path $env:LOCALAPPDATA "KanjoFamily\cli"
          $env:PYTHONPATH = $CliDir
          python -c @"
          import http.server, threading, subprocess, sys, os, tempfile

          received = {}

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  received['auth'] = self.headers.get('Authorization')
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{\"status\":\"ok\",\"received_at\":1700000000}')
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 0), Handler)
          port = server.server_address[1]
          t = threading.Thread(target=server.handle_request)
          t.start()

          tmp = tempfile.mkdtemp()
          env = dict(os.environ)
          env.pop('KANJO_FAMILY_TOKEN', None)
          env['KANJO_NO_NETWORK'] = '1'
          env['KANJO_DATA_DIR'] = os.path.join(tmp, 'data')
          env['KANJO_CACHE_DIR'] = os.path.join(tmp, 'cache')
          env['KANJO_CLAUDE_DIR'] = os.path.abspath('cli/tests/fixtures/claude')
          env['KANJO_ANTIGRAVITY_DIR'] = os.path.abspath('cli/tests/fixtures/antigravity')
          env['KANJO_CODEX_DIR'] = os.path.abspath('cli/tests/fixtures/codex')

          res = subprocess.run([sys.executable, '-m', 'kanjo', 'report-family', '--url', f'http://127.0.0.1:{port}', '--no-cache'],
                               env=env, capture_output=True)
          t.join()
          server.server_close()

          print('report-family stdout:', res.stdout.decode('utf-8', errors='replace'))
          print('report-family stderr:', res.stderr.decode('utf-8', errors='replace'))
          if res.returncode != 0:
              sys.exit(res.returncode)

          expected_auth = 'Bearer ci-windows-secret-token'
          actual_auth = received.get('auth')
          if actual_auth != expected_auth:
              print(f'Expected auth {expected_auth}, got {actual_auth}', file=sys.stderr)
              sys.exit(1)
          print('Local server received expected Bearer token from Windows Credential Manager!')
          "@
      - name: Scheduled task register, unregister and family-token clear
        shell: pwsh
        run: |
          $CliDir = Join-Path $env:LOCALAPPDATA "KanjoFamily\cli"
          $env:PYTHONPATH = $CliDir

          # 1. Register task with a second installer run (without -NoSchedule)
          powershell -ExecutionPolicy Bypass -NoProfile -File scripts/install-family-windows.ps1 -Server https://usage.example.com -CliZip kanjo-cli.zip -PythonExe python -SkipReport -NoPrompt
          if ($LASTEXITCODE -ne 0) { throw "installer exited with $LASTEXITCODE" }
          $task = Get-ScheduledTask -TaskName "Kanjo 家庭上报"
          if (-not $task) {
              throw "Scheduled task was not created!"
          }
          Write-Host "Task found: $($task.TaskName)"

          # 2. Run uninstall
          powershell -ExecutionPolicy Bypass -NoProfile -File scripts/install-family-windows.ps1 -Uninstall
          if ($LASTEXITCODE -ne 0) { throw "installer exited with $LASTEXITCODE" }
          $removedTask = Get-ScheduledTask -TaskName "Kanjo 家庭上报" -ErrorAction SilentlyContinue
          if ($removedTask) {
              throw "Scheduled task still exists after uninstall!"
          }
          Write-Host "Scheduled task successfully removed."

          # 3. Uninstall must also have cleared the token (install dir is gone, use the repo CLI)
          $env:PYTHONPATH = (Resolve-Path cli).Path
          $clearedStatus = python -m kanjo family-token status
          if ($clearedStatus.Trim() -ne "not set") {
              throw "Expected 'not set', got '$clearedStatus'"
          }
          Write-Host "Family token cleared by uninstall."

  # Desktop app: build + unit tests on every push / PR. The installers are only built for tags,
  # because the self-contained publish + vpk pack takes a few minutes per architecture.
  windows-app:
    name: Windows app
    runs-on: windows-latest
    # Release assets are uploaded with GITHUB_TOKEN; everything else only reads the repo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # Warnings are errors so the "0 warnings" promise cannot silently regress.
      - name: Build (Debug, warnings as errors)
        run: dotnet build windows/Kanjo.Windows.sln -c Debug -warnaserror
      - name: Build (Release, warnings as errors)
        run: dotnet build windows/Kanjo.Windows.sln -c Release -warnaserror
      # Tests run in Debug: they need the repo root (Debug-only assembly metadata) to read the
      # SwiftUI fixtures under ui/.
      - name: Test
        run: dotnet test windows/Kanjo.Windows.sln -c Debug --no-build --logger "trx;LogFileName=kanjo.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-tests
          path: "**/TestResults/kanjo.trx"
          if-no-files-found: ignore

      # Everything below only runs for tags (v*).
      - name: Install vpk
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet tool install -g vpk --version 1.2.158

      - name: Build releases (publish + python + CLI + vpk pack)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -ne $tag) { throw "VERSION ($version) does not match tag ($tag)" }
          # `dotnet tool install -g` puts vpk in %USERPROFILE%\.dotnet\tools.
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          foreach ($rid in @("win-x64", "win-arm64")) {
            Write-Host "==> $rid"
            pwsh -NoProfile -File windows/scripts/build-release.ps1 -Version $version -Rid $rid
            if ($LASTEXITCODE -ne 0) { throw "build-release.ps1 failed for $rid ($LASTEXITCODE)" }
          }

      - name: Upload installer artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: kanjo-windows
          path: |
            windows/dist/Kanjo-win-*.zip
            windows/dist/releases/**
          if-no-files-found: error

      # Attach to the GitHub Release when the maintainer has already created it.
      # A missing release is not a failure: the artifacts stay on the workflow run.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content -Raw VERSION).Trim()
          $files = @(
            "windows/dist/releases/win-x64/Kanjo-win-x64-Setup.exe",
            "windows/dist/releases/win-x64/Kanjo-$version-win-x64-full.nupkg",
            "windows/dist/releases/win-x64/RELEASES-win-x64",
            "windows/dist/releases/win-x64/releases.win-x64.json",
            "windows/dist/releases/win-arm64/Kanjo-win-arm64-Setup.exe",
            "windows/dist/releases/win-arm64/Kanjo-$version-win-arm64-full.nupkg",
            "windows/dist/releases/win-arm64/RELEASES-win-arm64",
            "windows/dist/releases/win-arm64/releases.win-arm64.json",
            "windows/dist/Kanjo-win-x64-$version.zip",
            "windows/dist/Kanjo-win-arm64-$version.zip"
          ) | Where-Object { Test-Path $_ }
          if (-not $files) { throw "no release artifacts to upload" }

          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Release $tag does not exist yet; skipping upload (artifacts are on this run)."
            exit 0
          }
          $attempt = 0
          while ($true) {
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -eq 0) { break }
            $attempt++
            if ($attempt -ge 3) { throw "gh release upload failed with $LASTEXITCODE" }
            Start-Sleep -Seconds 5
          }
          Write-Host "Uploaded $($files.Count) file(s) to release $tag."
